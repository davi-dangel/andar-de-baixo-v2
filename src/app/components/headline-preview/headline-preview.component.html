<button
    class="edition-card"
    type="button"
    [attr.aria-label]="'Abrir edição n.º ' + headline?.id + ': ' + headline?.title">
    <span class="edition-masthead">Andar de Baixo</span>
    <span class="edition-folio">
        <span>Primeira página</span>
        <span>Edição n.º {{headline?.id}}</span>
    </span>

    <span class="edition-copy">
        <span class="edition-title">{{headline?.title}}</span>
        @if (headline?.subtitle) {
            <span class="edition-subtitle" [innerHTML]="headline?.subtitle"></span>
        }
        @if (headline?.abstract) {
            <span class="edition-abstract">{{headline?.abstract}}</span>
        }
    </span>

    @if (headline?.location || headline?.date) {
        <span class="edition-details">
            @if (headline?.location) {
                <span>{{headline?.location}}</span>
            }
            @if (headline?.date) {
                <span>{{headline?.date}}</span>
            }
        </span>
    }

    @if (headline?.imgPreview) {
        <img
            class="edition-image"
            [src]="headline?.imgPreview"
            [alt]="headline?.title ?? ''"
            loading="lazy">
    }
</button>
